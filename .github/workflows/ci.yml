# CI for the @kernlbase/orion runtime.
#
# Deliberately small. It validates the four things that can break a release — the package installs,
# the suite passes, the tarball builds, and the CLI is executable — on the Node versions the
# manifest claims (engines: >=22).
#
# The runtime has ZERO production dependencies and no build step, so there is nothing to compile
# and no lockfile to cache. `npm install` here exists to prove the manifest is valid, not to fetch
# anything.
#
# The package lives in v0/, so every job runs with that as its working directory.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    working-directory: v0

jobs:
  test:
    name: test · node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 22 is the engines floor (node:sqlite); 24 is current. Both are claimed, so both are tested.
        node: ['22', '24']
        # ubuntu and windows are both first-class: the runtime was developed on Windows, and
        # windows-latest is what verifies the documented Git Bash shell prerequisite really holds.
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # The runtime shells out through LocalSandbox, which resolves the BARE NAME `bash` through
      # PATH. On a Windows runner that is not automatically a usable shell:
      #
      #   - the default PATH carries `C:\Program Files\Git\cmd`, which holds git.exe but NOT
      #     bash.exe, so `bash` may not resolve at all;
      #   - where WSL is present, `C:\Windows\System32\bash.exe` resolves FIRST and runs in a
      #     different filesystem namespace (`/mnt/d/...`), so it cannot see the checked-out
      #     workspace and silently produces empty output.
      #
      # Both failure modes look like product defects and are not. Put Git Bash's own bin/ at the
      # FRONT of PATH so `bash` is unambiguously Git Bash for every later step in the job.
      - name: Use Git Bash as `bash` (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # GitHub runners install Git for Windows under ProgramFiles; some Windows setups
          # install per-user. Check both rather than assuming one layout.
          $candidates = @(
            "$env:ProgramFiles\Git\bin",
            "${env:ProgramFiles(x86)}\Git\bin",
            "$env:LOCALAPPDATA\Programs\Git\bin"
          )
          $gitBin = $candidates | Where-Object { Test-Path (Join-Path $_ 'bash.exe') } | Select-Object -First 1
          if (-not $gitBin) {
            Write-Error "Git Bash not found. Looked in: $($candidates -join '; ')"
            exit 1
          }
          $gitBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "prepended to PATH: $gitBin"

      # Fail fast and legibly if `bash` is still not the shell the suite needs. tests/run-all.mjs
      # runs this same check internally; doing it here as its own step means a broken runner is
      # obvious in the job list rather than buried in suite output.
      - name: Shell preflight (Windows)
        if: runner.os == 'Windows'
        run: node -e "import('./tests/run-all.mjs').then(m=>{const r=m.preflightShell();console.log(JSON.stringify(r));if(!r.ok)process.exit(1);})"

      - name: Install
        run: npm install

      - name: Test
        run: npm test

      # The suite writes a results-*.json per suite. On failure those say which assertion went,
      # which the console tail alone does not — CI runners are slower and more constrained than
      # a dev box, so failures here are often ones that cannot be reproduced locally.
      - name: Failing assertions
        if: failure()
        shell: bash
        run: |
          for f in tests/results-*.json; do
            [ -e "$f" ] || continue
            node -e "
              const r = require('./$f');
              const bad = (r.results || []).filter(x => !x.pass);
              if (bad.length) {
                console.log('--- $f: ' + bad.length + ' failed');
                for (const b of bad) console.log('   [' + b.group + '] ' + b.test + (b.detail ? ' :: ' + b.detail : ''));
              }
            " || true
          done

      - name: Pack
        run: npm pack

      - name: CLI is executable
        # Exercises the published bin path, not the source path — this is what a consumer runs.
        run: node ./src/cli/index.mjs --version

  static:
    name: static checks · typecheck + lint
    runs-on: ubuntu-latest
    # W5 Q1 + Q3 — two static gates that need no runtime dependency.
    #
    # Q1 (`tsc --checkJs`): A GATE, not a build step: `noEmit` is set, nothing is compiled, and the runtime
    # still ships as plain ESM with zero runtime dependencies. `typescript` and `@types/node` are
    # devDependencies and never reach the tarball — the `files` allowlist in package.json covers
    # src/docs/ADRs/examples only, and the package job asserts that.
    #
    # It earns its place: it found a real defect on its first run. `supportsBlockGlyphs` called
    # `stream.getDefaultEncoding()`, which does not exist on a WriteStream — the optional call
    # always returned undefined, so a documented branch of the terminal-encoding decision had
    # never once executed. The suite could not see it; the checker found it immediately.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install (devDependencies only — the runtime has none)
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      # W5 Q3. Zero-dependency, and it checks the conventions this project actually holds rather
      # than a general style opinion. The load-bearing rule is the control-character scan: a `\b`
      # written through a tool that interprets it becomes a literal 0x08, the file still parses,
      # the regex silently stops matching, and nothing shows it. That has happened twice here, so
      # the byte scan the session prompt mandates is now permanent rather than a manual step.
      - name: Lint (conventions + control-character scan)
        run: npm run lint

  eval:
    name: eval harness selfcheck
    runs-on: ubuntu-latest
    # W5 E1. `eval/` lives at the repository ROOT, outside v0/, which is part of why it was
    # never gated: the other jobs all run with `working-directory: v0`.
    #
    # This does NOT run the benchmark — that needs a live model, and `eval/cli run` rightly
    # refuses to substitute a scripted one. What it gates is the harness itself: that every
    # task validates, every fixture materialises, and every verifier still FAILS on the
    # unfixed fixture. The last of those is the point. When W5 made LocalSandbox.exec async,
    # eleven unawaited call sites turned every verifier into an unconditional PASS, and
    # nothing noticed, because nothing ran. A benchmark that cannot fail reports numbers
    # people believe.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Eval selfcheck
        run: node eval/selfcheck.mjs

  package:
    name: package validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pack
        run: npm pack

      - name: Install the tarball into a clean directory and use it
        # A consumer-shaped check: install the real artifact, then run the binary and import the
        # public API. Catches a broken `bin`, a bad `exports` map, or a missing file in `files`.
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/consumer"
          cp kernlbase-orion-*.tgz "$RUNNER_TEMP/consumer/"
          cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null
          npm install ./kernlbase-orion-*.tgz
          ./node_modules/.bin/orionctl --version
          node --input-type=module -e "
            const m = await import('@kernlbase/orion');
            if (typeof m.Store !== 'function') throw new Error('Store missing from public API');
            const e = await import('@kernlbase/orion/events');
            if (!Object.isFrozen(e.EVENT_TYPES)) throw new Error('EVENT_TYPES not frozen');
            console.log('public API OK:', Object.keys(m).length, 'exports');
          "

      - name: Tarball must not leak research or local state
        # The package ships from v0/ with an explicit `files` allowlist. This asserts the allowlist
        # is actually doing its job rather than trusting it.
        run: |
          set -e
          # Match on the FILE LIST only. `npm pack` also prints the package name and tarball
          # filename, and naive substring matching against those produces false positives — e.g.
          # `.orion` matches `kernlbase-orion-0.1.0.tgz`. Strip to paths first.
          files=$(npm pack --dry-run 2>&1 | sed -n 's/^npm notice *[0-9.]*[kMG]\?B *//p')
          for bad in 'research/' 'eval/' 'productization/' 'tests/' '\.orion/' 'node_modules/' '\.env' '\.npmrc'; do
            if echo "$files" | grep -qE "(^|/)$bad"; then
              echo "LEAK: tarball contains '$bad'"; echo "$files"; exit 1
            fi
          done
          # Databases and local run state must never ship, whatever their directory.
          if echo "$files" | grep -qE '\.(db|sqlite3?)$'; then
            echo "LEAK: tarball contains a database file"; echo "$files"; exit 1
          fi
          echo "tarball clean"
